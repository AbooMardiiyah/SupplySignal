[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phc-supplysignal"
version = "0.1.0"
description = "Uncertainty-aware PHC commodity supply decision support"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
model = ["joblib>=1.3", "lightgbm>=4.0", "scikit-learn>=1.4"]
app = ["plotly>=5.20", "streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.6", "playwright>=1.45"]
notebook = ["nbformat>=5.10", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29", "matplotlib>=3.9", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
